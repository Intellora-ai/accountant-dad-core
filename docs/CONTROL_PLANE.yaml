  - id: "D-12"
    question: "What happens when a bulk reversal hits a voucher it cannot resolve?"
    options:
      - "Fail closed and resume explicitly."
      - "Roll the whole batch back."
      - "Skip and carry on."
    recommended_default: "Fail closed and resume explicitly."
    owner_answer: >-
      Fail-closed, resumable. The batch stops at the first unresolved voucher.
      Vouchers already reversed are never re-reversed, because reversing is
      CLEANUP and not a rollback - a batch that stops at voucher 4 correctly
      leaves 1 to 3 gone. Four failure categories, and UNKNOWN_OUTCOME is never
      treated as a rejection. Settled 2026-08-09.
    status: IMPLEMENTED_AFTER_OWNER_DECISION
    evidence_needed: >-
      Full state machine in ARCHITECTURE.md section 4.14, implemented in
      accountant/reversal.py. tests/test_bulk_reversal.py (41 tests), _web (11),
      _cli (9). NARROWED 2026-08-10 - D-12 settled the batch policy but left one
      half open, and accountant/reversal.py reconcile() says so in its own
      comment: refuse the whole batch, or skip the unknown voucher and finish
      the rest. That half is now D-29 and the answer is REFUSE THE WHOLE BATCH.
      D-12 is NOT superseded; every word of its 2026-08-09 answer still stands.
    next_action: "None for D-12 itself. The half it left open is D-29, answered 2026-08-10."

