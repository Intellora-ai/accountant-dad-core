# ---------------------------------------------------------------------------
# PHASE 7 - the full record, at a granularity the phase table cannot carry.
#
# WHY THIS IS A SEPARATE KEY AND NOT MORE FIELDS ON phases[id: "7"].
#   `allowed_statuses` above has six values and every phase status is checked
#   against it. The labels this record needs - NOT_MEASURED, NOT_IMPLEMENTED,
#   READY_FOR_PR, and a pointer to the next phase - are not among them. The
#   cheap move is to widen `allowed_statuses`; that check exists to guard the
#   phase table, and widening it to fit one record is exactly the weakening
#   this project forbids. So the vocabulary stays at six and the richer record
#   lives here, outside the table, where it binds nothing else.
#
# WHY IT EXISTS AT ALL. Phase 7 is a SAFETY result about GST and it is one
# sentence away from reading as a FEATURE result. This system refuses a bill
# carrying GST and hands it to the person. That is safe. It is not GST support,
# and the two must never be collapsed into one PASS.
#
#   status here          READY_FOR_PR - local evidence complete, no PR open
#   status in the table  PARTIALLY_VERIFIED - the merge gates have not run
#
# The coordinator advances this through GITHUB_GATES_PENDING, READY_TO_MERGE
# and COMPLETE as the pull request moves. Nothing here may be advanced by an
# agent on the strength of a local run.
# ---------------------------------------------------------------------------

