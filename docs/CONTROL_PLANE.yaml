# CONTROL_PLANE — the one machine-readable statement of what is true today.
#
# WHY THIS FILE EXISTS
# --------------------
# The project's documents disagreed with each other. An audit found many
# contradictions. The fix is not more documents and not deleting history. It is
# ONE file a machine can read, plus secondary documents that agree with it.
#
# AUTHORITY. This file wins. If any document disagrees with a value here, the
# document is wrong and the disagreement is recorded in
# artifacts/document_contradictions.md rather than quietly edited away.
#
# WORD MAP, stated once.
#   The older documents use the word COMPLETE. "COMPLETE" is not a status in
#   this file. It maps to PASSED. Nothing else about it changes.
#
# WHAT "PASSED" IS NOT. A phase is never PASSED because code exists, because
# unit tests exist, because FakeTally passes, because GitHub is green, or
# because a document says so. PASSED means the phase's own exit observable was
# seen.
#
# THREE CONVENTIONS a reader (or a validator) needs to know.
#   1. metrics[].current may be `null`. That means "nobody has measured it".
#      A null is never a pass. It is written down instead of omitted, because a
#      frozen acceptance criterion that is missing from this file is exactly the
#      gap this file exists to close.
#   2. Some metrics have no owner-set target. The target then carries a
#      "TARGET NOTE ... derived, not owner-set" line inside `formula`. A
#      derived target is never presented as an owner decision.
#   3. `depends_on` means "this metric cannot move until that OTHER METRIC
#      moves". It is a metric id or null, which is what
#      scripts/validate_project_truth.py enforces. It is NOT where a dependency
#      on the owner or on the environment is recorded. Those live in `blockers`
#      (each one carries kind: OWNER or ENVIRONMENT), in `decisions`, and
#      machine-readably in artifacts/launch_baseline.json under the key
#      `owner_or_environment_dependency`.
#
# DECISION IDS — READ THIS BEFORE GREPPING FOR A D-NUMBER.
#   Three sources allocated D-numbers and two of them collided. Nothing was
#   renumbered, because these ids are already linked from other documents and
#   from commit messages, and a renumbered id is an unauditable one.
