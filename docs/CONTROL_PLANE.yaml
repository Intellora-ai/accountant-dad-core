# VOCABULARY NOTE, and it matters. The two blocks below do NOT use
# `allowed_statuses`. That list - PASSED, NOT_PASSED, PARTIALLY_VERIFIED,
# BLOCKED_ENVIRONMENT, OWNER_DECISION_REQUIRED, NOT_STARTED - governs
# `phases:`, `metrics:` and `launch_gates:`, and scripts/validate_project_truth.py
