decisions:

  # ---------------------------------------------------------------------------
  # D-01 to D-13 were already in docs/DECISIONS.md before this file existed and
  # are reproduced here unchanged. D-14 to D-21 belong to
  # docs/CLOUD_ARCHITECTURE.md and docs/DATA_POLICY.md and are summarised here
  # so the register is complete - those two documents remain the owners of the
  # wording. D-22 upward were allocated by this file, next free.
  # ---------------------------------------------------------------------------

  - id: "D-01"
    question: >-
      The Tally licence. Two instructions in the repository contradict each
      other and only the owner can say which one is live. Both are recorded
      verbatim below and neither is being acted on.
    options:
      - "A. Buy a legitimate non-Educational licence. Roughly Rs 885 per the earlier price check. The contract fixture can then run and the Phase 2 exit closes."
      - "B. Stay on Educational for good. Phase 2 stays BLOCKED_ENVIRONMENT permanently and no live evidence is ever obtainable."
    recommended_default: "B, by inaction. Nothing is bought, nothing is bypassed, nothing is simulated. This is what happens if nobody answers."
    owner_answer: null
    status: OPEN
    evidence_needed: >-
      VERBATIM, INSTRUCTION ONE - PROJECT_STATE.md section 19 step 20 -
      "OWNER: buy a non-Educational TallyPrime licence -> unblocks 16 and 19".
      VERBATIM, INSTRUCTION TWO - PROJECT_STATE.md section 24, headed OWNER
      DECISION 2026-08-08 - "Do not purchase, activate, bypass or simulate a
      non-Educational licence." Instruction two is the later of the two and is
      labelled an owner decision, so it PROBABLY supersedes. That is a guess and
      it is not being acted on. One of these two lines is stale and only the
      owner can say which.
    next_action: >-
      One sentence from the owner - "buy the licence" or "stay on Educational" -
      and which of the two lines to delete. Until then B-02 stays open and
      everything downstream reports BLOCKED_ENVIRONMENT.

  - id: "D-02"
    question: "Is the 2026-08-07 fixture date frozen, or may it be changed to suit the environment?"
    options:
      - "Keep it frozen. This is the recorded position."
      - "Approve a specific new date and record why."
    recommended_default: "Frozen. Silence keeps it."
    owner_answer: null
    status: OPEN
    evidence_needed: >-
      tests/test_tally_contract.py:53 posts on 2026-08-07. ARCHITECTURE.md
      section 7 Phase 2 says the date is part of the acceptance criteria, not an
      implementation detail, so editing it changes what the phase means. Nothing
      has changed it and nothing will without a yes in words.
    next_action: "None unless the owner wants it changed. This entry exists so the freeze is a decision rather than an accident."

  - id: "D-03"
    question: "Is Tally.ERP 9 in scope, or is TallyPrime the only supported product?"
    options:
      - "In scope, and frozen criterion 6.8 stands as written."
      - "Out of scope, and 6.8 is narrowed to TallyPrime with the reason recorded."
    recommended_default: "The criterion stands and stays unmet."
    owner_answer: null
    status: OPEN
    evidence_needed: >-
      Frozen criterion 6.8 requires reading on both TallyPrime and Tally.ERP 9,
      or naming the unsupported version explicitly in the error. Only
      TallyPrime 7.0 has ever answered. ERP 9 has never been tested.
      docs/CLOUD_ARCHITECTURE.md section 14.3 carries the question forward
      unchanged and does not settle it.
    next_action: "Owner says 'ERP 9 in scope' or 'TallyPrime only'. See also D-24, which asks the same shape of question for Windows versions."

  - id: "D-04"
    question: >-
      May this project take a runtime dependency - a web framework locally, or a
      signing library in the cloud connector? Today dependencies is empty.
    options:
      - "Stay stdlib-only. Zero runtime dependencies, which is where the project is today."
      - "Approve one named runtime dependency, with the reason recorded."
    recommended_default: "Stay stdlib-only. This is the safe default and it is what the frozen plan already says."
    owner_answer: null
    status: OPEN
    evidence_needed: >-
      pyproject.toml has dependencies = [] - verified 2026-08-10.
      ARCHITECTURE.md section 10 lists 'a web framework' under deliberately
      outside this architecture, trigger 'separately approved; runtime
      dependencies are [] today'. Owner deferred the local half as open item
      M-b - 'first figure our tally thing'. THE CLOUD HALF IS THE SAME
      QUESTION - docs/CLOUD_ARCHITECTURE.md section 5 records that Ed25519
      message signatures would need the `cryptography` package and calls it
      'D-04 territory'. A coordinator instruction referred to the cloud
      runtime-dependency question as D-11; D-11 is already N = 10, so it is
      recorded here instead.
    next_action: "Owner approves a named dependency or confirms stdlib-only. Answering it also unblocks option C of D-16."

  - id: "D-05"
    question: >-
      Are Ltd, Limited, Pvt Ltd, Private Limited, Company and & Co the same
      supplier as the bare name? This is a business rule, not a bug.
    options:
      - "A. Same supplier. Fewer questions asked, and an LLP invoice can post against Ltd-only history."
      - "B. Different suppliers. Safer, and every suffix variant becomes a new unknown vendor that has to be answered for."
    recommended_default: "A, the current behaviour, which is the less safe of the two. That is exactly why this is in the register rather than left to the code."
    owner_answer: null
    status: OPEN
    evidence_needed: >-
      Measured 2026-08-09 - LLP, Inc, Corp and Corporation are KEPT and do not
      collide; the six named above are stripped. So a sole proprietor 'Sharma
      Traders', a private limited 'Sharma Traders Pvt Ltd' and a partnership
      'Sharma Traders & Co' are one key today - two GSTINs, two taxpayers, two
      TDS treatments, one ledger. The rule is already inconsistent with itself,
      so whichever way the owner decides, one half is wrong today.
      tests/test_memory.py:1000-1007 cements the current behaviour.
      THE CHEAP MEASUREMENT THAT WOULD SETTLE IT, runnable today against the
      owner's own Tally - count the party names in read_vouchers that differ
      only by a stripped suffix. Zero pairs means the strip costs them nothing;
      one pair means it is already merging two of their own suppliers.
