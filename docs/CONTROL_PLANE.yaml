decisions:

  # ---------------------------------------------------------------------------
  # D-01 to D-13 were already in docs/DECISIONS.md before this file existed and
  # are reproduced here unchanged. D-14 to D-21 belong to
  # docs/CLOUD_ARCHITECTURE.md and docs/DATA_POLICY.md and are summarised here
  # so the register is complete - those two documents remain the owners of the
  # wording. D-22 upward were allocated by this file, next free.
  # ---------------------------------------------------------------------------

  - id: "D-01"
    question: >-
      The Tally licence. Two instructions in the repository contradict each
      other and only the owner can say which one is live. Both are recorded
      verbatim below and neither is being acted on.
    options:
      - "A. Buy a legitimate non-Educational licence. Roughly Rs 885 per the earlier price check. The contract fixture can then run and the Phase 2 exit closes."
      - "B. Stay on Educational for good. Phase 2 stays BLOCKED_ENVIRONMENT permanently and no live evidence is ever obtainable."
    recommended_default: "B, by inaction. Nothing is bought, nothing is bypassed, nothing is simulated. This is what happens if nobody answers."
    owner_answer: >-
      OWNER, 2026-08-10, verbatim - "Use a legitimate non-Educational licence if
      you want real Tally validation. Until physically available, remain
      BLOCKED_ENVIRONMENT." A STATED PREFERENCE IS NOT A LICENCE. Nothing here
      buys one, and the standing instructions of D-26 are unchanged - do not
      purchase, activate, bypass or simulate a non-Educational licence.
    status: BLOCKED_ENVIRONMENT
    evidence_needed: >-
      VERBATIM, INSTRUCTION ONE - PROJECT_STATE.md section 19 step 20 -
      "OWNER: buy a non-Educational TallyPrime licence -> unblocks 16 and 19".
      VERBATIM, INSTRUCTION TWO - PROJECT_STATE.md section 24, headed OWNER
      DECISION 2026-08-08 - "Do not purchase, activate, bypass or simulate a
      non-Educational licence." ANSWERED 2026-08-10 - the two lines are not
      after all a contradiction. Line one names what the owner would prefer if
      real Tally validation is wanted; line two names what may be done from
      here, which is nothing. Both stay. Neither is deleted. Educational mode
      accepts vouchers only on the 1st, 2nd and 31st, so the frozen 2026-08-07
      fixture is refused - measured 2026-08-08, 2026-08-07 REJECTED and
      2026-08-31 ACCEPTED.
    next_action: >-
      NOTHING AN AGENT CAN DO. The owner physically obtains a licence, or this
      stays where it is. Until a licence exists on the machine - RealTally
      validation is BLOCKED_ENVIRONMENT, the phase 5 live validation run is
      BLOCKED_ENVIRONMENT, B-02 stays open, and LG-14, LG-18 and LG-19 stay
      NOT_PASSED. FOUR THINGS ARE FORBIDDEN, restated because this is the entry
      people reach for - never change the frozen 2026-08-07 fixture, never
      bypass Educational mode, never simulate a licence, never claim RealTally
      evidence that was not produced by a licensed run.

  - id: "D-02"
    question: "Is the 2026-08-07 fixture date frozen, or may it be changed to suit the environment?"
    options:
      - "Keep it frozen. This is the recorded position."
      - "Approve a specific new date and record why."
    recommended_default: "Frozen. Silence keeps it."
    owner_answer: null
    status: OPEN
    evidence_needed: >-
      tests/test_tally_contract.py:53 posts on 2026-08-07. ARCHITECTURE.md
      section 7 Phase 2 says the date is part of the acceptance criteria, not an
      implementation detail, so editing it changes what the phase means. Nothing
      has changed it and nothing will without a yes in words.
    next_action: "None unless the owner wants it changed. This entry exists so the freeze is a decision rather than an accident."

  - id: "D-03"
    question: "Is Tally.ERP 9 in scope, or is TallyPrime the only supported product?"
    options:
      - "In scope, and frozen criterion 6.8 stands as written."
      - "Out of scope, and 6.8 is narrowed to TallyPrime with the reason recorded."
    recommended_default: "The criterion stands and stays unmet."
    owner_answer: null
    status: OPEN
    evidence_needed: >-
      Frozen criterion 6.8 requires reading on both TallyPrime and Tally.ERP 9,
      or naming the unsupported version explicitly in the error. Only
      TallyPrime 7.0 has ever answered. ERP 9 has never been tested.
      docs/CLOUD_ARCHITECTURE.md section 14.3 carries the question forward
      unchanged and does not settle it.
    next_action: "Owner says 'ERP 9 in scope' or 'TallyPrime only'. See also D-24, which asks the same shape of question for Windows versions."

  - id: "D-04"
    question: >-
      May this project take a runtime dependency - a web framework locally, or a
      signing library in the cloud connector? Today dependencies is empty.
    options:
      - "Stay stdlib-only. Zero runtime dependencies, which is where the project is today."
      - "Approve one named runtime dependency, with the reason recorded."
    recommended_default: "Stay stdlib-only. This is the safe default and it is what the frozen plan already says."
    owner_answer: null
    status: OPEN
    owner_standing_rule: |-
      OWNER, 2026-08-10, verbatim - "no new runtime dependency is approved
      automatically." The question of WHICH dependency stays OPEN. The rule
      about HOW one may ever be added is now fixed, and it is eight things that
      must all be written down BEFORE any dependency is added:
        1. the exact dependency, by name and version
        2. why it is needed, and what breaks without it
        3. its licence
        4. its security impact
        5. its deployment impact
        6. whether it violates the current policy, which is dependencies = []
        7. the smallest alternative that was considered, and why it lost
        8. the register entry recording all seven of the above
      WHAT MAY STILL PROCEED - cloud work on architecture, threat model,
      protocol, test design, data flow and connector boundaries. That work must
      not add the dependency and must not build an irreversible runtime around
      one.
    evidence_needed: >-
      pyproject.toml has dependencies = [] - verified 2026-08-10.
      ARCHITECTURE.md section 10 lists 'a web framework' under deliberately
      outside this architecture, trigger 'separately approved; runtime
      dependencies are [] today'. Owner deferred the local half as open item
      M-b - 'first figure our tally thing'. THE CLOUD HALF IS THE SAME
      QUESTION - docs/CLOUD_ARCHITECTURE.md section 5 records that Ed25519
      message signatures would need the `cryptography` package and calls it
      'D-04 territory'. A coordinator instruction referred to the cloud
      runtime-dependency question as D-11; D-11 is already N = 10, so it is
      recorded here instead.
    next_action: >-
      Owner approves ONE NAMED dependency, with all eight records above filled
      in, or confirms stdlib-only. Answering it also unblocks option C of D-16.
      Still blocked while this is open - option C of D-16, and any framework
      for the local front door.

  - id: "D-05"
    question: >-
      Are Ltd, Limited, Pvt Ltd, Private Limited, Company and & Co the same
      supplier as the bare name? This is a business rule, not a bug.
    options:
      - "A. Same supplier. Fewer questions asked, and an LLP invoice can post against Ltd-only history."
      - "B. Different suppliers. Safer, and every suffix variant becomes a new unknown vendor that has to be answered for."
    recommended_default: "A, the current behaviour, which is the less safe of the two. That is exactly why this is in the register rather than left to the code."
    owner_answer: >-
      B, SEPARATE. OWNER, 2026-08-10, verbatim - "Treat legal forms as
      meaningful by default. Do not silently merge Ltd, Pvt Ltd, LLP, Inc, Corp,
      or & Co. If identity is ambiguous, ask or hand over." TWO THINGS ARE NOW
      SEPARATE AND MUST STAY SEPARATE. Technical normalisation - Unicode form,
      case, whitespace - is one thing and may continue. Business identity is a
      different thing. Normalisation must not destroy legal-form information.
      An ambiguous identity is a question to the person, never a silent merge.
    status: ANSWERED
    evidence_needed: >-
      Measured 2026-08-09 - LLP, Inc, Corp and Corporation are KEPT and do not
      collide; the six named above are stripped. So a sole proprietor 'Sharma
      Traders', a private limited 'Sharma Traders Pvt Ltd' and a partnership
      'Sharma Traders & Co' are one key today - two GSTINs, two taxpayers, two
      TDS treatments, one ledger. The rule is already inconsistent with itself,
      so whichever way the owner decides, one half is wrong today.
      tests/test_memory.py:1000-1007 cements the current behaviour.
      THE CHEAP MEASUREMENT THAT WOULD SETTLE IT, runnable today against the
      owner's own Tally - count the party names in read_vouchers that differ
      only by a stripped suffix. Zero pairs means the strip costs them nothing;
      one pair means it is already merging two of their own suppliers.
    next_action: >-
      ANSWERED 2026-08-10, NOT YET IMPLEMENTED. The code still strips the six
      suffixes and tests/test_memory.py:1000-1007 still cements that. This entry
      becomes IMPLEMENTED_AFTER_OWNER_DECISION only when a NAMED TEST proves
      that a bare name and its Ltd, Pvt Ltd, LLP, Inc, Corp and & Co variants
      are different suppliers, and that Unicode and whitespace normalisation
      still happens. UNBLOCKED BY THIS ANSWER - the wrong-vendor risk now has a
      rule to build to. STILL BLOCKED - nothing; no other decision waits on it.

  - id: "D-06"
    question: "When the memory index and the live ledger disagree, which one wins?"
    options:
      - "The live ledger always wins and the index is rebuilt."
      - "The index wins and the staleness is surfaced to the person."
      - "Refuse and ask."
    recommended_default: "The current behaviour, where the index can win. It is the unsafe one."
    owner_answer: >-
      LIVE TALLY WINS. OWNER, 2026-08-10, verbatim - "Live Tally wins over stale
      memory. If live Tally and memory disagree, make the entry UNCLEAR and ask
      instead of silently posting." REQUIRED BEHAVIOUR - show the conflict to
      the person, record both sources, and never let stale memory silently
      override contradictory current Tally data. A disagreement is a question,
      not a posting.
    status: ANSWERED
    evidence_needed: >-
      Reproduced 2026-08-09 - bootstrap 'Sharma Traders -> Purchases' from 40
      vouchers, then post 60 'Sharma Traders -> Repairs & Maintenance' by hand
      in Tally. The next entry proposes Purchases, posts straight through, and
      raises no flag and no question. vendor_switch
      (accountant/detect/detectors.py:85) is the only detector on the
      production path, it names its history parameter `_history`, and it never
      reads it, so the live ledger is passed into evaluate and discarded.
      Nothing re-bootstraps - configure() runs it once. THE BUG IS OBJECTIVE.
      THE RESPONSE IS POLICY - re-read on what schedule, compare against what,
      flag or block, at what threshold. docs/CLOUD_ARCHITECTURE.md notes this
      gets SHARPER in the cloud shape, not softer, because a connector offline
      for a week has a staler index.
    next_action: >-
      ANSWERED 2026-08-10, NOT YET IMPLEMENTED. vendor_switch at
      accountant/detect/detectors.py:85 still names its history parameter
      `_history` and still never reads it, so today the live ledger is passed in
      and discarded. This entry becomes IMPLEMENTED_AFTER_OWNER_DECISION only
      when a NAMED TEST proves the reproduction above now ends in an UNCLEAR
      entry with a question, showing both sources, instead of a silent post.
      UNBLOCKED BY THIS ANSWER - the wrong-account risk now has a rule.
      STILL BLOCKED - nothing else waits on it.

  - id: "D-07"
    question: "May a declared licence mode be trusted when the real one cannot be read?"
    options:
      - "Let the operator declare the mode and carry it as DECLARED, NOT MEASURED."
