  #      scope and was NOT renumbered. See the SECOND LABEL SET note in the
  #      header of this file.

  - id: "D-29"
    question: >-
      A bulk reversal stops with one voucher whose outcome nobody can name. Six
      other vouchers are known and still need cleaning up. Does the resume
      refuse the WHOLE batch, or skip the unknown voucher and finish the rest?
      This is the one half D-12 left open.
    options:
      - "A. Refuse the whole batch. Safest. Outstanding cleanup can never finish while one voucher's fate is unknown."
      - "B. Skip the unknown voucher and carry on. Cleanup finishes, and a batch continues past an unresolved unknown."
    recommended_default: "None was invented. accountant/reversal.py says in its own comment that both readings are defensible, that they are mutually exclusive, and that the choice is an accounting-operations decision rather than an engineering one."
    owner_answer: >-
      A, REFUSE THE WHOLE BATCH. OWNER, 2026-08-10, verbatim - "REFUSE THE WHOLE
      BATCH WHEN ANY VOUCHER HAS UNKNOWN_OUTCOME. Safety beats partial cleanup.
      Never delete six known vouchers while one voucher's fate is unknown."
      REQUIRED BEHAVIOUR, six parts - a resume is refused while any voucher is
      still unknown; no further voucher is deleted; every known result stays
      recorded; the operator is shown the unresolved voucher; a separate
      reconciliation operation is required; and a resume is permitted only once
      every voucher has a known verified state.
    status: ANSWERED
    evidence_needed: >-
      THE DEFECT THIS SETTLES, measured. accountant/reversal.py reconcile()
      returns reconciled=True on every path, including the one where every read
      raised. resume() then opens, and after a reconciliation that settled
      nothing it removed six more vouchers from a company holding one voucher
      whose fate was unknown - nine of ten gone. The strict-xfail test that pins
      it is tests/test_reversal_recovery.py::
      test_a_resume_writes_nothing_more_when_the_reconciliation_settled_nothing,
      and its reason string names this as an open owner decision, "Defect D3".
      The existing test it conflicts with is
      test_an_unknown_outcome_voucher_is_never_retried_by_a_resume, which
      currently requires resume to proceed and skip. That test now encodes the
      losing option and must change. D-12's own state machine already agrees
      with the owner in spirit - RETRYABLE in accountant/reversal.py deliberately
      excludes the unknown state.
    next_action: >-
      ANSWERED 2026-08-10, NOT YET IMPLEMENTED. Another agent is changing
      accountant/reversal.py. This entry becomes IMPLEMENTED_AFTER_OWNER_DECISION
      only when the strict xfail above flips to a passing test under its own
      name. UNBLOCKED BY THIS ANSWER - the reversal recovery path, which had two
      mutually exclusive readings and now has one. STILL BLOCKED - nothing else;
      no other decision waits behind it.

