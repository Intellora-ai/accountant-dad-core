  - id: "D-22"
    question: >-
      The launch rule for N1. Does the product launch on the AGGREGATE
      false-alarm rate, which passes at 6.29, or on the WORST SINGLE DEPARTMENT,
      which fails at 33.33? These give opposite answers and only one can be the
      gate.
    options:
      - "A. Aggregate. Launch is allowed at 6.29 against a target of 10. One book in seven then sees a rate over three times the target and nobody promised them otherwise."
      - "B. Worst slice. Launch is blocked until the worst single book is inside 10. Safest, and it is the number one customer actually experiences."
      - "C. A named intermediate rule, for example 'no book above 20 and the aggregate inside 10', written down with its reason."
    recommended_default: >-
      B. A customer does not experience an aggregate; they experience their own
      book. This is a recommendation, not a decision, and nothing is being acted
      on until the owner answers.
    owner_answer: >-
      B, and both numbers are reported. OWNER, 2026-08-10, verbatim - "Use both
      aggregate and worst-department results. For launch, do not hide a
      department that fails." THE GATE THAT FOLLOWS - aggregate 6.29 is a PASS,
      worst department DHSC 33.33 is NOT_PASSED, the target is at or under 10,
      and therefore THE OVERALL DETECTOR LAUNCH GATE IS NOT_PASSED. It stays
      NOT_PASSED until either the worst-department rule is satisfied, or that
      department is taken out of scope by an explicit owner scope decision.
      EVERY DETECTOR REPORT MUST NOW CARRY SEVEN THINGS - the aggregate, the
      held-out slice, the worst department, every department's own value, the
      denominator, the formula, and false-alarm examples.
    status: ANSWERED
    evidence_needed: >-
      Measured, artifacts/detector_evidence.md and artifacts/detector_evidence.json -
      aggregate 6.29 PASS, held-out 2.90 PASS, DHSC 33.33 NOT_PASSED, and DBT
      has zero clean entries so it reports 'not measured', which is not a pass
      either. All seven departments, per 100 clean entries - MHCLG 0.00,
      DFT 0.00, HMT 0.00, DWP 3.70, DEFRA 5.26, DHSC 33.33, DBT not measured.
      The failing detector on DHSC is `magnitude`. Note the headroom - the
      calibration half has headroom of ZERO entries, so one more false alarm
      there flips it.
    next_action: >-
      ANSWERED 2026-08-10. LG-20 is NOT_PASSED and now stays NOT_PASSED for a
      DECIDED reason rather than an undecided one. UNBLOCKED BY THIS ANSWER -
      the launch rule itself; the question is no longer answerable by whichever
