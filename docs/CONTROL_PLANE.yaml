#   NOT_SELECTED · INCOMPLETE
#
# The two overlap only at OWNER_DECISION_REQUIRED. They are kept separate
# rather than merged, because widening `allowed_statuses` would weaken the
# check that guards the phase table.
#
# NOTHING BELOW MAY BE SET TO PASS OR COMPLETE WITHOUT EVIDENCE.
# No human-required item may be marked complete by an agent, ever.
# ===========================================================================

