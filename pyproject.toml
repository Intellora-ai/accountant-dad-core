[project]
name = "accountant-dad"
version = "0.0.1"
description = "A safe, reversible decision-and-posting layer in front of Tally."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["accountant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
