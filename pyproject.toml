[project]
name = "accountant-dad"
version = "0.0.1"
description = "A safe, reversible decision-and-posting layer in front of Tally."
readme = "README.md"
requires-python = ">=3.12"
# The first runtime dependencies this project has ever had. `dependencies = []`
# was a posture, not an accident: it was the fact `tests/test_no_reader.py`
# rested on to prove no document reader could exist here. These three were
# cleared by the owner as D-30 (docs/DECISIONS.md, 2026-08-13) and are pinned
# to lower bounds only. The set is asserted exactly - a fourth entry fails
# `test_the_project_declares_exactly_the_dependencies_the_owner_approved`.
dependencies = [
    "pypdf>=5.0",       # PDF text layer - reads a born-digital bill
    "pytesseract>=0.3", # thin wrapper over the tesseract binary, for scans
    "Pillow>=11.0",     # decodes the image pytesseract hands to tesseract
]

[project.optional-dependencies]
# One tool per responsibility. Black, Flake8, isort, Pylint, mypy, Poetry, tox,
# MutPy, Cosmic Ray and mutmut are deliberately absent - they overlap with
# something already here or add runtime.
dev = [
    "pytest>=8.0",         # test runner
    "pytest-xdist>=3.8",   # parallel tests
    "pytest-testmon>=2.2", # changed-test selection, local and PR only
    "pytest-gremlins>=1.9",# mutation testing
    "ruff>=0.16",          # lint AND format - the only one of either
    "pyright>=1.1.411",    # type checking - the only type checker
    "coverage>=7.15",      # coverage measurement
    "pytest-cov>=7.0",     # --cov, so one pytest run produces coverage.xml
    "diff-cover>=10.4",    # changed-line coverage gate
    "pip-audit>=2.10",     # dependency vulnerabilities
    "bandit>=1.9",         # Python security scan
    "zizmor>=1.29",        # GitHub Actions security lint
    "prek>=0.4",           # installs the commit hook
    "build>=1.5",          # sdist/wheel
    "twine>=7.0",          # packaging metadata validation
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["accountant*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ci"]
# `destructive` marks the four tamper tests in ci/test_protection.py that ask
# GitHub to delete things. They are skipped unless RUN_DESTRUCTIVE_TESTS=1.
markers = [
    "destructive: asks GitHub to destroy something; needs RUN_DESTRUCTIVE_TESTS=1",
]

# ---------------------------------------------------------------------------
# ruff - lint and format. target-version is deliberately unset so ruff infers
# it from requires-python above, rather than being a second place to keep in
# sync.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting (replaces isort)
    "UP",       # pyupgrade
    "B",        # bugbear - real bug patterns
    "SIM",      # simplifiable code
    "C4",       # comprehensions
    "RUF",      # ruff's own rules
    "S",        # flake8-bandit subset - security patterns at lint speed
    "ARG",      # unused arguments
    "PTH",      # pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
# Tests assert. S101 forbids assert. Tests are where assert belongs, wherever
# they live - ci/test_protection.py is a test that happens to sit next to the
# scripts it guards.
"tests/*" = ["S101"]
"ci/test_*.py" = ["S101"]
# S105 flags a string literal assigned to something named like a token.
# `ci/test_protection.py` is the file whose subject IS which identity `gh` runs
# as, so its fixtures name GH_TOKEN and none of them is a credential - they are
# the strings "a-token-value" and "the-real-one". Scoped to this file; the rule
# stays live everywhere else, which is where a real token would get pasted.
"ci/test_protection.py" = ["S101", "S105"]
# S105/S106 flag a string literal handed to something named like a password, a
# secret or a token. The three files below are the ones whose SUBJECT is exactly
# that - passwords and sessions, the destroying routes' credentials, and the
# connector secret - so their fixtures trip the rule and none of them is a leak.
# Scoped to these files only: the rule stays live for the other sixty test
# files, which is where a real credential would actually get pasted by accident.
"tests/test_auth.py" = ["S101", "S105", "S106"]
"tests/test_reversal_guard.py" = ["S101", "S105", "S106"]
"tests/test_connector.py" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------------------
# pyright - the only type checker
# ---------------------------------------------------------------------------
[tool.pyright]
# `scripts` JOINED 2026-08-17, ON THE OWNER'S APPROVAL, AND IT WAS AN OMISSION
# RATHER THAN A DECISION. `ci/gates.toml` records the ruling this list is meant
# to implement, verbatim: "Strict, over source AND tests. Owner-set 2026-08-07:
# 'strict, on everything'." This line said three of the four. It was written once
# in f653c07 and never revisited, no test pinned it, and nothing recorded a
# reason to leave scripts out.
#
# WHAT THAT COST: 432 pyright strict errors accumulated in scripts/ that no tool
# in this repository could see. The typecheck gate never looked, and the
# staged-guard hook looks only at STAGED files - so an unmodified script was
# invisible to everything. All 432 are fixed as of this change; the scope is
# widened only once the count is zero, so the gate goes green on repaired code
# and never on a suppression.
#
# scripts/ IS NOT STANDALONE, which is why it belongs here: 14 of its files
# import `accountant`, and two test files import `scripts`. It is coupled to the
# shipped package and to the suite.
#
# NOTE, MEASURED: 14 of the 33 scripts are in .gitignore, so they never reach a
# CI runner and this line cannot check them there. It covers the 19 tracked
# ones. pyright does not read .gitignore, so locally it checks all 33.
include = ["accountant", "tests", "ci", "scripts"]
typeCheckingMode = "strict"
reportMissingImports = "error"
# Without these, pyright resolves nothing from the project environment, pytest
# included, and every fixture and decorator silently degrades to Unknown.
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------
# coverage - branch coverage, no exclusions. fail_under is owner-set at 90.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["accountant"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
